# 임시 워크플로 — PHOTOS 의 Wikimedia URL 이 살아 있는지 검사합니다.
#
# 이 저장소는 원래 Actions 워크플로가 없습니다(Pages legacy 방식).
# 작업 환경에서 wikimedia 로 나가는 네트워크가 막혀 있어 러너를 대신 씁니다.
# 검증이 끝나면 이 파일은 지웁니다. main 에는 올라가지 않습니다.
name: photo-harvest

on:
  workflow_dispatch:
  push:
    branches: [claude/travel-image-resources-3xfkrm]
    paths:
      - tools/commons-photos.py
      - .github/workflows/photo-harvest.yml
      - index.html

permissions:
  contents: read

concurrency:
  group: photo-harvest
  cancel-in-progress: true

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: index.html 의 모든 사진 URL 이 200 인지 검사
        run: python3 tools/commons-photos.py check index.html
